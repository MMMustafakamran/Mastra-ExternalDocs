name: Doc sync

# Accepts upstream drift: rewrites doc-snapshot/ and opens a PR for review.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this change is being accepted (goes in the PR body)'
        required: false
        default: ''

concurrency:
  group: doc-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync doc-snapshot/ to the live docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Captured first; --update erases the diff.
      - name: Capture the drift that is being accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node ci/check-doc-drift.mjs > drift-before.txt 2>&1
          echo "checker exited $?"
          set -e
          cat drift-before.txt

      # 0 synced, 2 partly (rest needs a human), 3 unreadable: all open a PR.
      - name: Rewrite the snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node ci/check-doc-drift.mjs --update > sync.txt 2>&1
          CODE=$?
          set -e
          cat sync.txt
          case "$CODE" in 0|2|3) ;; *) exit "$CODE" ;; esac
          echo "SYNC_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          git add -- doc-snapshot/
          if git diff --cached --quiet -- doc-snapshot/; then
            {
              echo '## Doc sync: nothing to do'
              echo
              echo 'The snapshot already matches the live docs.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="doc-sync/${GITHUB_RUN_ID}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -m 'chore(docs): sync doc-snapshot/ to the live docs'
          git push -u origin "$BRANCH"

          {
            echo 'Accepts the current state of the live docs as the new baseline.'
            echo
            if [ -n "${REASON:-}" ]; then
              echo "**Reason given:** ${REASON}"
              echo
            fi
            echo '### The drift this accepts'
            echo
            echo '```'
            cat drift-before.txt
            echo '```'
            echo
            if [ "${SYNC_CODE:-0}" != "0" ]; then
              echo '### Not applied -- needs a human'
              echo
              echo '```'
              grep -E 'needs a human|NOT CHECKED|^ • |NEW UPSTREAM' sync.txt || true
              echo '```'
              echo
            fi
            echo '> Merging this makes the change above invisible to future drift'
            echo '> checks. Before merging, reconcile the demo pages with the new'
            echo '> code blocks -- a snapshot that moves without them means the'
            echo '> recordings document something the docs no longer say.'
          } > pr-body.md

          gh pr create \
            --title 'chore(docs): sync doc-snapshot/ to the live docs' \
            --body-file pr-body.md \
            --head "$BRANCH" \
            --base "${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the accepted diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-sync-drift
          path: |
            drift-before.txt
            sync.txt
          retention-days: 30
          if-no-files-found: warn
